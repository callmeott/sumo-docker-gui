# SUMO GUI in the browser — run netedit and sumo-gui on macOS without XQuartz.
# (macOS Tahoe broke XQuartz OpenGL; here the GUIs run on virtual displays in
# Docker, viewed via noVNC.)
#
#   docker compose up -d --build
#   open http://localhost:6080     <- index page: launch netedit / sumo-gui
#
# The folder set by SUMO_DATA (default: this folder) is mounted at /data inside
# the container — open and save your network files there, e.g.:
#   SUMO_DATA=~/my-sumo-scenarios docker compose up -d
#
# Optional env: SCREEN=2560x1440 (virtual display size), UI_FONT="..." (UI font).
# Ports are bound to 127.0.0.1 on purpose: the VNC sessions and the command
# launcher are unauthenticated, so keep them off the network.
# Note: "$$" below is compose escaping for a literal "$" in embedded scripts.

services:
  sumo-gui:
    image: sumo-gui-novnc
    ports:
      - "127.0.0.1:6080:6080"   # index page + launcher
      - "127.0.0.1:6081:6081"   # netedit  (noVNC)
      - "127.0.0.1:6082:6082"   # sumo-gui (noVNC)
    volumes:
      - "${SUMO_DATA:-.}:/data"
    restart: unless-stopped
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/eclipse-sumo/sumo:latest
        RUN apt-get update && apt-get install -y --no-install-recommends \
              xvfb x11vnc novnc websockify openbox \
              fonts-thai-tlwg fonts-noto-cjk x11-utils xdotool && \
            rm -rf /var/lib/apt/lists/*

        # Open application windows maximized (dialogs keep their natural size).
        RUN sed -i 's|</applications>|<application type="normal"><maximized>yes</maximized></application></applications>|' \
            /etc/xdg/openbox/rc.xml

        COPY <<'HTML' /web/index.html
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="utf-8">
        <title>SUMO GUI</title>
        <style>
          body { font-family: -apple-system, "Helvetica Neue", sans-serif;
                 background: #1e2227; color: #e8eaed; margin: 0; padding: 40px 16px;
                 display: flex; flex-direction: column; align-items: center;
                 min-height: calc(100vh - 80px); justify-content: center; }
          h1 { font-weight: 600; margin-bottom: 0.2em; }
          p.sub { color: #9aa0a6; margin-top: 0; }
          .cards { display: flex; gap: 24px; margin: 28px 0 8px; flex-wrap: wrap; justify-content: center; }
          .card { width: 330px; padding: 22px; border-radius: 12px;
                  background: #2b3138; border: 1px solid #3c434c; }
          .card h2 { margin: 0 0 8px; font-size: 1.25em; color: #8ab4f8; }
          .card p { margin: 0 0 14px; color: #bdc1c6; font-size: 0.9em; line-height: 1.45; }
          .card label { display: block; color: #9aa0a6; font-size: 0.75em; margin-bottom: 4px; }
          .cmdline { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; }
          .cmdline span.prog { color: #e8eaed; font-family: ui-monospace, monospace; font-size: 0.85em; }
          .cmdline input { flex: 1; background: #1e2227; color: #e8eaed; border: 1px solid #3c434c;
                           border-radius: 6px; padding: 7px 9px; font-family: ui-monospace, monospace;
                           font-size: 0.85em; }
          .cmdline input:focus { outline: none; border-color: #8ab4f8; }
          .buttons { display: flex; gap: 10px; }
          button, a.open { flex: 1; text-align: center; padding: 9px 0; border-radius: 8px;
                           font-size: 0.9em; cursor: pointer; text-decoration: none; }
          button { background: #8ab4f8; color: #1e2227; border: none; font-weight: 600; }
          button:hover { background: #aecbfa; }
          a.open { background: transparent; color: #8ab4f8; border: 1px solid #3c434c; }
          a.open:hover { border-color: #8ab4f8; }
          .note { max-width: 620px; color: #9aa0a6; font-size: 0.85em;
                  line-height: 1.6; text-align: center; }
          .note a, .footer a { color: #8ab4f8; text-decoration: none; }
          .footer { margin-top: 28px; color: #9aa0a6; font-size: 0.85em; text-align: center; }
          code { background: #2b3138; padding: 1px 5px; border-radius: 4px; }
        </style>
        </head>
        <body>
        <h1>Eclipse SUMO</h1>
        <p class="sub">GUI applications in your browser</p>
        <div class="cards">
          <div class="card">
            <h2>netedit</h2>
            <p>Network editor — create and edit networks, demand and
               additional infrastructure. Press <b>E</b> to draw edges.</p>
            <form method="POST" action="/launch">
              <input type="hidden" name="app" value="netedit">
              <label for="netedit-args">command line (editable)</label>
              <div class="cmdline"><span class="prog">netedit</span>
                <input id="netedit-args" name="args" placeholder="e.g. -s /data/net.net.xml"></div>
              <div class="buttons">
                <button type="submit">Launch / Restart</button>
                <a class="open" id="netedit-open" href="#">Open window</a>
              </div>
            </form>
          </div>
          <div class="card">
            <h2>sumo-gui</h2>
            <p>Simulation viewer — open a .sumocfg or network and run the
               traffic simulation interactively.</p>
            <form method="POST" action="/launch">
              <input type="hidden" name="app" value="sumo-gui">
              <label for="sumo-gui-args">command line (editable)</label>
              <div class="cmdline"><span class="prog">sumo-gui</span>
                <input id="sumo-gui-args" name="args" placeholder="e.g. -c /data/run.sumocfg"></div>
              <div class="buttons">
                <button type="submit">Launch / Restart</button>
                <a class="open" id="sumo-gui-open" href="#">Open window</a>
              </div>
            </form>
          </div>
        </div>
        <p class="note">
          <b>Launch / Restart</b> restarts the program with the given arguments
          (takes a few seconds; the window reloads). <b>Open window</b> just views
          the running instance. Your data folder is mounted at <code>/data</code>.
          netedit and sumo-gui are the only windowed SUMO programs — the rest
          (netconvert, duarouter, &hellip;) are command-line:
          <code>docker compose exec sumo-gui bash</code>.
        </p>
        <p class="footer">
          Powered by <a href="https://eclipse.dev/sumo/">Eclipse SUMO</a>
          &nbsp;&middot;&nbsp; <a href="https://sumo.dlr.de/docs/">Documentation</a>
          &nbsp;&middot;&nbsp; not affiliated with the SUMO project
        </p>
        <script>
          var host = location.hostname;
          var vnc = '/vnc.html?autoconnect=true&resize=scale';
          document.getElementById('netedit-open').href  = 'http://' + host + ':6081' + vnc;
          document.getElementById('sumo-gui-open').href = 'http://' + host + ':6082' + vnc;
          fetch('/args').then(function (r) { return r.json(); }).then(function (a) {
            document.getElementById('netedit-args').value  = a['netedit']  || '';
            document.getElementById('sumo-gui-args').value = a['sumo-gui'] || '';
          });
        </script>
        </body>
        </html>
        HTML

        COPY <<'PYSERVER' /usr/local/bin/gui-server.py
        #!/usr/bin/env python3
        """Serves /web plus a tiny launcher API:
        GET /args            -> current command-line args per app (JSON)
        POST /launch         -> save args, restart the app, redirect to its noVNC page
        The respawn loop in start-gui.sh re-reads the args file on every restart."""
        import http.server, json, os, subprocess, urllib.parse

        APPS = {
            "netedit":  {"args_file": "/tmp/netedit.args",  "port": 6081},
            "sumo-gui": {"args_file": "/tmp/sumo-gui.args", "port": 6082},
        }

        class Handler(http.server.SimpleHTTPRequestHandler):
            def __init__(self, *a, **kw):
                super().__init__(*a, directory="/web", **kw)

            def do_GET(self):
                if self.path.rstrip("/") == "/args":
                    data = {}
                    for app, cfg in APPS.items():
                        try:
                            data[app] = open(cfg["args_file"]).read().strip()
                        except OSError:
                            data[app] = ""
                    body = json.dumps(data).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                else:
                    super().do_GET()

            def do_POST(self):
                if self.path.rstrip("/") != "/launch":
                    self.send_error(404)
                    return
                length = int(self.headers.get("Content-Length", 0))
                form = urllib.parse.parse_qs(self.rfile.read(length).decode())
                app = form.get("app", [""])[0]
                args = form.get("args", [""])[0].strip()
                if app not in APPS:
                    self.send_error(400, "unknown app")
                    return
                cfg = APPS[app]
                with open(cfg["args_file"], "w") as f:
                    f.write(args)
                subprocess.run(["pkill", "-x", app])  # respawn loop restarts it
                hostname = self.headers.get("Host", "localhost").split(":")[0]
                self.send_response(303)
                self.send_header("Location",
                                 "http://%s:%d/vnc.html?autoconnect=true&resize=scale"
                                 % (hostname, cfg["port"]))
                self.end_headers()

        http.server.ThreadingHTTPServer(("0.0.0.0", 6080), Handler).serve_forever()
        PYSERVER

        COPY <<'SCRIPT' /usr/local/bin/start-gui.sh
        #!/bin/bash
        # netedit on display :1 (noVNC 6081), sumo-gui on :2 (6082), index on 6080.
        set -e

        SCREEN="$${SCREEN:-1920x1080}"
        WIDTH="$${SCREEN%x*}"
        HEIGHT="$${SCREEN#*x}"

        # FOX apps render all UI text with a single Xft font (no per-glyph
        # fallback); force one with broad coverage so CJK labels render.
        UI_FONT="$${UI_FONT:-Noto Sans CJK SC}"
        cat > /etc/fonts/local.conf <<FONTCONF
        <?xml version="1.0"?>
        <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
        <fontconfig>
          <match target="pattern">
            <edit name="family" mode="prepend" binding="strong"><string>$${UI_FONT}</string></edit>
          </match>
        </fontconfig>
        FONTCONF

        run_app() {
          local app="$$1" display="$$2" vncport="$$3" wsport="$$4"
          Xvfb "$$display" -screen 0 "$${WIDTH}x$${HEIGHT}x24" &
          sleep 1
          DISPLAY="$$display" openbox &
          # -add_keysyms lets non-US layouts (e.g. Thai) type over VNC
          x11vnc -display "$$display" -rfbport "$$vncport" \
                 -nopw -forever -shared -quiet -xkb -add_keysyms &
          websockify --web=/usr/share/novnc "$$wsport" "localhost:$$vncport" &
          # respawn on exit, re-reading the (web-editable) args file each time
          # ("|| true" keeps the loop alive under set -e when the app is killed)
          ( while true; do
              DISPLAY="$$display" "$$app" $$(cat "/tmp/$$app.args" 2>/dev/null) || true
              sleep 2
            done ) &
        }

        cd /data
        run_app netedit  :1 5901 6081
        run_app sumo-gui :2 5902 6082

        exec python3 /usr/local/bin/gui-server.py
        SCRIPT

        RUN chmod +x /usr/local/bin/start-gui.sh /usr/local/bin/gui-server.py
        EXPOSE 6080 6081 6082
        ENTRYPOINT ["/usr/local/bin/start-gui.sh"]
