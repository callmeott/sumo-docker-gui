# SUMO GUI in the browser — run netedit and sumo-gui on macOS without XQuartz.
#
# Setup:   cp env.sample .env   (then edit .env — see README.md)
# Start:   docker compose up -d --build
# Use:     open http://localhost:6080
#
# Ports are bound to 127.0.0.1 on purpose: the VNC sessions and the command
# launcher are unauthenticated, so keep them off the network.

services:
  sumo-gui:
    build: .
    image: sumo-gui-novnc
    ports:
      - "127.0.0.1:6080:6080"   # index page + launcher
      - "127.0.0.1:6081:6081"   # netedit  (noVNC)
      - "127.0.0.1:6082:6082"   # sumo-gui (noVNC)
    volumes:
      # your SUMO files; appears as /data inside the applications
      - "${SUMO_DATA:-~/Sumo}:/data"
    environment:
      - SCREEN=${SCREEN:-1920x1080}
      - UI_FONT=${UI_FONT:-Noto Sans CJK SC}
    restart: unless-stopped
